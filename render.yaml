databases:
  - name: customer-review-db
    plan: free
    databaseName: customer_reviews
    user: customer_reviews_user

services:
  - type: web
    name: customer-review-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: customer-review-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GOOGLE_REVIEW_URL
        value: https://g.page/r/CSLhXGE7iSkSEAE/review
      - key: BREVO_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_NAME
        value: Customer Reviews
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: customer-review-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
